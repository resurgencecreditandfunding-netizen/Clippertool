<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClipCore</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#"><span class="mark"></span>ClipCore <small>OS</small></a>
    <nav>
      <a class="btn ghost" href="#">My clips</a>
      <a class="btn ghost" href="#admin" id="admin-link" hidden>Admin</a>
      <div class="menu" id="menu">
        <button class="btn ghost" id="menu-btn" aria-label="Account">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        </button>
        <div class="pop">
          <div class="who" id="who"></div>
          <button id="pw-open">Change password</button>
          <button id="logout">Sign out</button>
        </div>
      </div>
    </nav>
  </header>
  <main class="wrap" id="view"></main>
  <dialog id="modal"></dialog>
  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
