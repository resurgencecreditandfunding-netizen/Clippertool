[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipcore-os"
version = "0.1.0"
description = "Permission-based live-stream clipping engine: many streamers in, ranked compliant Shorts out."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlmodel>=0.0.16",
  "httpx>=0.27",
  "numpy>=1.26",
  "streamlink>=6.0",
  "yt-dlp>=2024.1.1",
]

[project.optional-dependencies]
captions = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
clipcore = "clipcore.cli:main"

[tool.setuptools.packages.find]
include = ["clipcore*"]

[tool.setuptools.package-data]
clipcore = ["web/*"]
