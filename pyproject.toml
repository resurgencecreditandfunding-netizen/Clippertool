[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipcore-os"
version = "1.0.0"
description = "Paste a stream VOD link, get ranked, captioned vertical shorts."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlmodel>=0.0.16",
  "httpx>=0.27",
  "numpy>=1.26",
  "yt-dlp>=2024.1.1",
  "faster-whisper>=1.0",
  "anthropic>=2.0",
  "opencv-python-headless>=4.8,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clipcore = "clipcore.cli:main"

[tool.setuptools.packages.find]
include = ["clipcore*"]

[tool.setuptools.package-data]
clipcore = ["web/*"]
